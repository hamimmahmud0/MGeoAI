[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mgeoai"
version = "0.2.4"
description = "Provenance-preserving multimodal traffic incident intelligence fusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.20",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "types-python-dateutil>=2.9"]
evaluation = ["matplotlib>=3.8"]

[project.scripts]
mgeoai = "traffic_fusion.cli:app"
# Backward-compatible command alias for existing deployments.
traffic-fusion = "traffic_fusion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["tests"]
