[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mgeoai"
version = "0.3.0"
description = "Road-accident news: LLM extraction, human annotation, same-accident grouping and an open dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "huggingface_hub>=1.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic>=2.8",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[project.scripts]
mgeoai = "traffic_fusion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/kaggle_lfm/kernel.py"]  # a template: push.sh fills in the placeholders

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["tests"]
